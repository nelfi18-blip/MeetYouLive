name: Android Debug APK

# Generates a Debug APK and uploads it as a GitHub Actions artifact.
# No secrets, no signing, no publishing.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/android/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: current branch)'
        required: false
        default: ''
      app_url:
        description: 'App URL loaded by Capacitor WebView'
        required: false
        default: 'https://meetyoulive.net'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Java 21 is required by capacitor.build.gradle (JavaVersion.VERSION_21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore google-services.json (Firebase)
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p frontend/android/app

          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Firebase secret is not configured."
            exit 1
          fi

          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > frontend/android/app/google-services.json
        shell: bash

      - name: Verify google-services.json exists
        run: |
          test -s frontend/android/app/google-services.json
        shell: bash

      - name: Verify google-services.json is gitignored
        run: |
          grep -Fxq 'frontend/android/app/google-services.json' .gitignore
        shell: bash

      # Capacitor sync generates the gitignored files that Gradle needs:
      #   - android/capacitor-cordova-android-plugins/
      #   - android/app/src/main/assets/public/
      #   - android/app/src/main/assets/capacitor.config.json
      #   - android/app/src/main/assets/capacitor.plugins.json
      #   - android/app/src/main/res/xml/config.xml
      # Cache Gradle home to speed up subsequent runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend
          npm ci
          NEXT_PUBLIC_APP_URL="${{ github.event.inputs.app_url || 'https://meetyoulive.net' }}" npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        shell: bash

      - name: Delete google-services.json
        if: always()
        run: |
          rm -f frontend/android/app/google-services.json
        shell: bash

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetYouLive-debug-${{ github.run_number }}
          # Standard output path for Gradle assembleDebug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
