name: Android Updateable Release APK

# Generates a signed Release APK that can be installed as an update over
# previous APKs with the same applicationId and signing key.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/android/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: current branch)'
        required: false
        default: ''
      app_url:
        description: 'App URL loaded by Capacitor WebView'
        required: false
        default: 'https://meetyoulive.net'
      version_code:
        description: 'Android versionCode (must be higher than the installed APK). Defaults to GitHub run number.'
        required: false
        default: ''
      version_name:
        description: 'Android versionName. Defaults to 1.0.<run_number>.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-apk:
    name: Build signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Java 21 is required by capacitor.build.gradle (JavaVersion.VERSION_21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Restore Firebase google-services.json
        id: restore_google_services
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Error: ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required for updateable release APK builds."
            exit 1
          fi

          if ! printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json; then
            echo "Error: Failed to decode ANDROID_GOOGLE_SERVICES_JSON_BASE64. Verify the secret contains valid base64-encoded content."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/google-services.json';
          const raw = fs.readFileSync(path, 'utf8').trim();

          if (!raw) {
            console.error('Error: google-services.json is empty.');
            process.exit(1);
          }

          try {
            const data = JSON.parse(raw);
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
              console.error('Error: google-services.json must contain a JSON object.');
              process.exit(1);
            }

            if (Object.keys(data).length === 0) {
              console.error('Error: google-services.json must not be an empty JSON object.');
              process.exit(1);
            }

            if (!data.project_info) {
              console.error('Error: google-services.json must contain project_info.');
              process.exit(1);
            }

            if (!data.client) {
              console.error('Error: google-services.json must contain client.');
              process.exit(1);
            }

            if (!Array.isArray(data.client)) {
              console.error('Error: google-services.json client must be an array.');
              process.exit(1);
            }

            if (data.client.length === 0) {
              console.error('Error: google-services.json client array must not be empty.');
              process.exit(1);
            }
          } catch (error) {
            console.error(`Error: Invalid google-services.json (${error.message}).`);
            process.exit(1);
          }
          NODE

          echo "google_services_restored=true" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash

      - name: Verify Firebase config was restored
        if: steps.restore_google_services.outputs.google_services_restored == 'true'
        working-directory: frontend
        run: |
          test -s android/app/google-services.json
        shell: bash

      - name: Restore Android signing key
        working-directory: frontend
        run: |
          set -euo pipefail
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Error: $var is required for updateable release APK builds."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore; then
            echo "Error: Failed to decode ANDROID_KEYSTORE_BASE64. Verify the secret contains valid base64-encoded keystore content."
            exit 1
          fi
          test -s android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash

      # Capacitor sync generates the gitignored files that Gradle needs:
      #   - android/capacitor-cordova-android-plugins/
      #   - android/app/src/main/assets/public/
      #   - android/app/src/main/assets/capacitor.config.json
      #   - android/app/src/main/assets/capacitor.plugins.json
      #   - android/app/src/main/res/xml/config.xml
      - name: Capacitor sync (Android)
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.app_url || 'https://meetyoulive.net' }}
        run: npx cap sync android

      # Cache Gradle home to speed up subsequent runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build signed Release APK
        working-directory: frontend/android
        env:
          ORG_GRADLE_PROJECT_androidVersionCode: ${{ github.event.inputs.version_code || github.run_number }}
          ORG_GRADLE_PROJECT_androidVersionName: ${{ github.event.inputs.version_name || format('1.0.{0}', github.run_number) }}
          ORG_GRADLE_PROJECT_androidStoreFile: release.keystore
          ORG_GRADLE_PROJECT_androidStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_androidKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Print APK metadata
        working-directory: frontend/android
        env:
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || format('1.0.{0}', github.run_number) }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          cert_info="$(keytool -printcert -jarfile "$apk_path")"
          cert_sha256="$(printf '%s\n' "$cert_info" | awk -F'SHA256: ' '/SHA256:/ { print $2; exit }')"

          if [ -z "$cert_sha256" ]; then
            echo "Error: Unable to read APK signing certificate SHA-256 from $apk_path."
            exit 1
          fi

          {
            echo "applicationId=com.meetyoulive.app"
            echo "versionCode=$ANDROID_VERSION_CODE"
            echo "versionName=$ANDROID_VERSION_NAME"
            echo "signing=release"
            echo "signed=true"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "certificateSha256=$cert_sha256"
          } | tee app/build/outputs/apk/release/meetyoulive-release-metadata.txt
        shell: bash

      - name: Remove temporary Android secrets
        if: always()
        working-directory: frontend
        run: rm -f android/app/google-services.json android/app/release.keystore
        shell: bash

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetYouLive-release-${{ github.run_number }}
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/app/build/outputs/apk/release/meetyoulive-release-metadata.txt
          retention-days: 30
          if-no-files-found: error

      - name: Report APK update status
        env:
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || format('1.0.{0}', github.run_number) }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          metadata_path="frontend/android/app/build/outputs/apk/release/meetyoulive-release-metadata.txt"
          cert_sha256="$(awk -F= '/^certificateSha256=/ { print $2; exit }' "$metadata_path")"
          {
            echo "## Android Updateable Release APK"
            echo

            echo "Artifact: MeetYouLive-release-${{ github.run_number }}"
            echo
            echo "- applicationId: com.meetyoulive.app"
            echo "- versionCode: $ANDROID_VERSION_CODE"
            echo "- versionName: $ANDROID_VERSION_NAME"
            echo "- signing: release keystore from ANDROID_KEYSTORE_BASE64"
            echo "- key alias: $ANDROID_KEY_ALIAS"
            echo "- certificate SHA-256: $cert_sha256"
            echo

            echo "Validate on a device with: adb install -r app-release.apk"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
