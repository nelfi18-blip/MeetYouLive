name: Android Debug APK

# Generates a Debug APK and uploads it as a GitHub Actions artifact.
# No secrets, no signing, no publishing.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/android/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: main)'
        required: false
        default: 'main'
      app_url:
        description: 'App URL loaded by Capacitor WebView'
        required: false
        default: 'https://www.meetyoulive.net'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    # Security and GPS draft PRs validate without automatic APK/AAB packaging.
    if: ${{ github.event_name != 'pull_request' || (github.head_ref != 'fix/android-sensitive-screen-capture' && github.head_ref != 'feat/android-profile-gps-location') }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Java 21 is required by capacitor.build.gradle (JavaVersion.VERSION_21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Android Google Web Client ID
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CLIENT_ID:-}" ]; then
            echo "Error: GOOGLE_CLIENT_ID is required for Android Debug APK builds."
            echo "Configure the existing Google Web Client ID as a GitHub Actions repository variable or secret named GOOGLE_CLIENT_ID."
            exit 1
          fi

          if ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -Eq '^[^[:space:]]+\.apps\.googleusercontent\.com$'; then
            echo "Error: GOOGLE_CLIENT_ID must be the existing Google Web Client ID."
            exit 1
          fi

          echo "GOOGLE_CLIENT_ID is present for Android Debug APK build."
        shell: bash

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Android Google Web Client ID was bundled
        working-directory: frontend
        run: |
          set -euo pipefail
          if ! grep -R -F -q -- "$GOOGLE_CLIENT_ID" .next; then
            echo "Error: Android frontend build did not include the configured Google Web Client ID."
            exit 1
          fi
          echo "Google Web Client ID is present in the Android frontend build."
        shell: bash

      - name: Restore Firebase google-services.json
        id: restore_google_services
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Firebase config missing; debug build will proceed without Firebase. Production/release builds must configure ANDROID_GOOGLE_SERVICES_JSON_BASE64."
            echo "google_services_restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json; then
            echo "Error: Failed to decode ANDROID_GOOGLE_SERVICES_JSON_BASE64. Verify the secret contains valid base64-encoded content."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/google-services.json';
          const raw = fs.readFileSync(path, 'utf8').trim();

          if (!raw) {
            console.error('Error: google-services.json is empty.');
            process.exit(1);
          }

          try {
            const data = JSON.parse(raw);
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
              console.error('Error: google-services.json must contain a JSON object.');
              process.exit(1);
            }

            if (Object.keys(data).length === 0) {
              console.error('Error: google-services.json must not be an empty JSON object.');
              process.exit(1);
            }

            if (!data.project_info) {
              console.error('Error: google-services.json must contain project_info.');
              process.exit(1);
            }

            if (!data.client) {
              console.error('Error: google-services.json must contain client.');
              process.exit(1);
            }

            if (!Array.isArray(data.client)) {
              console.error('Error: google-services.json client must be an array.');
              process.exit(1);
            }

            if (data.client.length === 0) {
              console.error('Error: google-services.json client array must not be empty.');
              process.exit(1);
            }
          } catch (error) {
            console.error(`Error: Invalid google-services.json (${error.message}).`);
            process.exit(1);
          }
          NODE

          echo "google_services_restored=true" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash

      - name: Verify Firebase config was restored
        if: steps.restore_google_services.outputs.google_services_restored == 'true'
        working-directory: frontend
        run: |
          test -s android/app/google-services.json
        shell: bash

      # Capacitor sync generates the gitignored files that Gradle needs:
      #   - android/capacitor-cordova-android-plugins/
      #   - android/app/src/main/assets/public/
      #   - android/app/src/main/assets/capacitor.config.json
      #   - android/app/src/main/assets/capacitor.plugins.json
      #   - android/app/src/main/res/xml/config.xml
      - name: Capacitor sync (Android)
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.app_url || 'https://www.meetyoulive.net' }}
        run: |
          set -euo pipefail
          # Package only the canonical MeetYouLive Android WebView origin.
          if [ "$NEXT_PUBLIC_APP_URL" != "https://www.meetyoulive.net" ]; then
            echo "::error::Android APK/AAB requires https://www.meetyoulive.net"
            exit 1
          fi
          npx cap sync android
          node -e 'const cfg = require("./android/app/src/main/assets/capacitor.config.json"); if (cfg.server?.url !== "https://www.meetyoulive.net") throw new Error("Android WebView URL is not canonical www");'

      # Cache Gradle home to speed up subsequent runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Remove temporary Firebase config
        if: always()
        working-directory: frontend
        run: rm -f android/app/google-services.json
        shell: bash

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetYouLive-debug-${{ github.run_number }}
          # Standard output path for Gradle assembleDebug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Report APK Firebase status
        env:
          GOOGLE_SERVICES_RESTORED: ${{ steps.restore_google_services.outputs.google_services_restored }}
        run: |
          {
            echo "## Android Debug APK"
            echo
            echo "Artifact: MeetYouLive-debug-${{ github.run_number }}"
            echo
            if [ "$GOOGLE_SERVICES_RESTORED" = "true" ]; then
              echo "APK generated with Firebase enabled."
            elif [ "$GOOGLE_SERVICES_RESTORED" = "false" ]; then
              echo "APK generated with Firebase disabled."
              echo
              echo "This no-firebase fallback is allowed only for debug/development APK builds."
              echo "Do not treat this disabled-Firebase debug run as ready for merge."
            else
              echo "Unexpected Firebase restore status: $GOOGLE_SERVICES_RESTORED"
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash


  # Intentionally separate from the production app. This build has a unique
  # application ID, a local/offline GPS test page and no production API/WebView.
  # It does NOT validate live Discover or change Play/production.
  build-gps-isolated-debug-apk:
    name: GPS isolated offline Debug APK
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/android-profile-gps-location'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout GPS draft (no merge)
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare offline, different-package GPS diagnostic
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          # These changes exist in the ephemeral CI checkout ONLY.
          config = Path("capacitor.config.ts")
          config.write_text("""import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.meetyoulive.app.gpstest',
            appName: 'MeetYouLive GPS TEST',
            webDir: 'public',
            android: { allowMixedContent: false, webContentsDebuggingEnabled: false }
          };
          export default config;
          """, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          existing = gradle.read_text(encoding="utf-8")
          needle = 'applicationId "com.meetyoulive.app"'
          assert existing.count(needle) == 1, "Original app ID unexpected; refuse unsafe build"
          gradle.write_text(existing.replace(
              needle, 'applicationId "com.meetyoulive.app.gpstest"'
          ), encoding="utf-8")

          ns = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          assert app is not None, "Application missing"
          app.set(ns + "label", "MeetYouLive GPS TEST")
          activity = app.find("activity")
          assert activity is not None, "MainActivity missing"
          activity.set(ns + "name", "com.meetyoulive.app.MainActivity")
          activity.set(ns + "label", "MeetYouLive GPS TEST")
          # Never claim the real MeetYouLive domain or custom deeplinks.
          for intent in list(activity.findall("intent-filter")):
              if intent.findall("data"):
                  activity.remove(intent)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Remove the production web assets in the CI copy; bundle only the
          # offline diagnostic screen, never the production site or backend.
          public = Path("public")
          if public.exists():
              shutil.rmtree(public)
          public.mkdir()
          public.joinpath("index.html").write_text("""<!doctype html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>MeetYouLive GPS TEST - solo prueba</title>
          <style>
          body{font-family:system-ui;background:#110a22;color:#f5edff;padding:24px;line-height:1.5}
          button{border:0;border-radius:14px;padding:16px;background:#8b5cf6;color:white;font-weight:700;font-size:17px}
          pre{white-space:pre-wrap;word-break:break-word;background:#241738;border-radius:12px;padding:16px}
          small{color:#c6b5e0}
          </style></head><body>
          <h2>MeetYouLive - GPS TEST</h2>
          <p>Aplicación separada para comprobar permisos GPS y ciudad/país.
          No inicia sesión, no entra en Live, no modifica tu perfil y no envía datos a MeetYouLive.</p>
          <button id="gps">Solicitar / actualizar ubicación</button>
          <pre id="status">Pulsa el botón. Comprueba permisos denegado, aproximado y preciso.</pre>
          <small>Los resultados solo se muestran en este teléfono. El geocodificador de Android puede usar servicios del sistema.</small>
          <script>
          const output = document.getElementById('status');
          document.getElementById('gps').addEventListener('click', async () => {
            output.textContent='Solicitando GPS…';
            if (!navigator.geolocation) {output.textContent='Geolocalización no disponible';return;}
            navigator.geolocation.getCurrentPosition(async (position) => {
              const p=position.coords;
              output.textContent='Permiso aceptado. Precisión estimada: '+Math.round(p.accuracy)+' m\\n'+
                'Coordenadas redondeadas (solo pantalla): '+p.latitude.toFixed(3)+', '+p.longitude.toFixed(3);
              try {
                const plugin=window.Capacitor?.Plugins?.MeetYouLiveGeocoder;
                if (!plugin?.reverseGeocode) throw Error('Bridge GPS nativo no registrado');
                const place=await plugin.reverseGeocode({latitude:p.latitude,longitude:p.longitude});
                output.textContent+='\\nGeocoder: '+JSON.stringify(place,null,2);
              } catch(e) {output.textContent+='\\nNombre de ubicación no disponible: '+(e.message||e);}
            },(err)=>{output.textContent='Permiso denegado o GPS falló (código '+err.code+'). No se enviaron datos.';},
              {enableHighAccuracy:true,timeout:15000,maximumAge:0});
          });
          </script></body></html>
          """, encoding="utf-8")
          assert "server:" not in config.read_text(), "Remote server must never be configured"
          assert "com.meetyoulive.app.gpstest" in gradle.read_text()
          assert "https://www.meetyoulive.net" not in public.joinpath("index.html").read_text()
          print("Offline GPS test harness prepared with distinct package ID")
          PY
      - name: Sync native Android plugin and build isolated debug APK
        working-directory: frontend
        run: |
          set -euo pipefail
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleDebug --no-daemon --stacktrace)
      - name: Assert APK has isolated application ID
        shell: bash
        run: |
          set -euo pipefail
          apk=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          tool="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$tool"
          "$tool" dump badging "$apk" | grep -F "package: name='com.meetyoulive.app.gpstest'"
          if "$tool" dump badging "$apk" | grep -F "package: name='com.meetyoulive.app' "; then
            echo "::error::APK uses production application ID"
            exit 1
          fi
      - name: Upload isolated GPS-only APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetYouLive-GPS-ISOLATED
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
