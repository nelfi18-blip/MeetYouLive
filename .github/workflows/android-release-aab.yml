name: Android Release AAB

# Generates the signed Android App Bundle (.aab) used for Google Play submission.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-release-aab.yml'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/android/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: main)'
        required: false
        default: 'main'
      app_url:
        description: 'App URL loaded by Capacitor WebView'
        required: false
        default: 'https://meetyoulive.net'
      version_code:
        description: 'Android versionCode (must be higher than the installed APK/AAB). Defaults to GitHub run number + 1.'
        required: false
        default: ''
      version_name:
        description: 'Android versionName. Defaults to 1.0.<version_code>.'
        required: false
        default: ''
      previous_version_code:
        description: 'Previous installed APK/AAB versionCode used for update validation.'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build signed Android Release AAB
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      BUNDLETOOL_VERSION: '1.18.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Java 21 is required by capacitor.build.gradle (JavaVersion.VERSION_21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Android Google Web Client ID
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CLIENT_ID:-}" ]; then
            echo "Error: GOOGLE_CLIENT_ID is required for Android Release AAB builds."
            echo "Configure the existing Google Web Client ID as a GitHub Actions repository variable or secret named GOOGLE_CLIENT_ID."
            exit 1
          fi

          if ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -Eq '^[^[:space:]]+\.apps\.googleusercontent\.com$'; then
            echo "Error: GOOGLE_CLIENT_ID must be the existing Google Web Client ID."
            exit 1
          fi

          echo "GOOGLE_CLIENT_ID is present for Android Release AAB build."
        shell: bash

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Android Google Web Client ID was bundled
        working-directory: frontend
        run: |
          set -euo pipefail
          if ! grep -R -F -q -- "$GOOGLE_CLIENT_ID" .next; then
            echo "Error: Android frontend build did not include the configured Google Web Client ID."
            exit 1
          fi
          echo "Google Web Client ID is present in the Android frontend build."
        shell: bash

      - name: Restore Firebase google-services.json
        working-directory: frontend
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Error: ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required for Release AAB builds."
            exit 1
          fi

          if ! printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json; then
            echo "Error: Failed to decode ANDROID_GOOGLE_SERVICES_JSON_BASE64. Verify the secret contains valid base64-encoded content."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/google-services.json';
          const raw = fs.readFileSync(path, 'utf8').trim();

          if (!raw) {
            console.error('Error: google-services.json is empty.');
            process.exit(1);
          }

          try {
            const data = JSON.parse(raw);
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
              console.error('Error: google-services.json must contain a JSON object.');
              process.exit(1);
            }

            if (Object.keys(data).length === 0) {
              console.error('Error: google-services.json must not be an empty JSON object.');
              process.exit(1);
            }

            if (!data.project_info) {
              console.error('Error: google-services.json must contain project_info.');
              process.exit(1);
            }

            if (!data.client) {
              console.error('Error: google-services.json must contain client.');
              process.exit(1);
            }

            if (!Array.isArray(data.client)) {
              console.error('Error: google-services.json client must be an array.');
              process.exit(1);
            }

            if (data.client.length === 0) {
              console.error('Error: google-services.json client array must not be empty.');
              process.exit(1);
            }
          } catch (error) {
            console.error(`Error: Invalid google-services.json (${error.message}).`);
            process.exit(1);
          }
          NODE
        shell: bash

      - name: Restore Android signing key
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Error: $var is required for Release AAB builds."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore; then
            echo "Error: Failed to decode ANDROID_KEYSTORE_BASE64. Verify the secret contains valid base64-encoded keystore content."
            exit 1
          fi
          test -s android/app/release.keystore

          if ! keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "Error: Release keystore validation failed. Verify ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
        shell: bash

      # Capacitor sync generates the gitignored files that Gradle needs:
      #   - android/capacitor-cordova-android-plugins/
      #   - android/app/src/main/assets/public/
      #   - android/app/src/main/assets/capacitor.config.json
      #   - android/app/src/main/assets/capacitor.plugins.json
      #   - android/app/src/main/res/xml/config.xml
      - name: Capacitor sync (Android)
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_URL: ${{ inputs.app_url || 'https://meetyoulive.net' }}
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Resolve Android version
        run: |
          set -euo pipefail

          version_code="${{ inputs.version_code }}"
          if [ -z "$version_code" ]; then
            version_code=$((GITHUB_RUN_NUMBER + 1))
          fi

          version_name="${{ inputs.version_name }}"
          if [ -z "$version_name" ]; then
            version_name="1.0.$version_code"
          fi

          previous_version_code="${{ inputs.previous_version_code || '1' }}"

          if ! printf '%s\n' "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "Error: Android versionCode must be numeric: $version_code"
            exit 1
          fi

          if ! printf '%s\n' "$previous_version_code" | grep -Eq '^[0-9]+$'; then
            echo "Error: Previous Android versionCode must be numeric: $previous_version_code"
            exit 1
          fi

          if [ "$version_code" -le "$previous_version_code" ]; then
            echo "Error: Android versionCode $version_code must be greater than previous APK/AAB versionCode $previous_version_code."
            exit 1
          fi

          {
            echo "ANDROID_VERSION_CODE=$version_code"
            echo "ANDROID_VERSION_NAME=$version_name"
            echo "ANDROID_PREVIOUS_VERSION_CODE=$previous_version_code"
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Build signed Release AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Download bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s "$RUNNER_TEMP/bundletool.jar"
        shell: bash

      - name: Verify signed Release AAB metadata
        working-directory: frontend/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab_path="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$aab_path" ]; then
            echo "Error: Release AAB was not generated at $aab_path."
            exit 1
          fi

          manifest="$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab_path")"

          package_name="$(printf '%s\n' "$manifest" | grep -oP '(?<=package=")[^"]+' | head -1)"
          apk_version_code="$(printf '%s\n' "$manifest" | grep -oP '(?<=android:versionCode=")[^"]+' | head -1)"
          apk_version_name="$(printf '%s\n' "$manifest" | grep -oP '(?<=android:versionName=")[^"]+' | head -1)"

          if [ "$package_name" != "com.meetyoulive.app" ]; then
            echo "Error: Unexpected applicationId/packageName: $package_name"
            exit 1
          fi

          if [ "$apk_version_code" != "$ANDROID_VERSION_CODE" ]; then
            echo "Error: AAB versionCode $apk_version_code does not match expected $ANDROID_VERSION_CODE."
            exit 1
          fi

          if [ "$apk_version_name" != "$ANDROID_VERSION_NAME" ]; then
            echo "Error: AAB versionName $apk_version_name does not match expected $ANDROID_VERSION_NAME."
            exit 1
          fi

          if [ "$apk_version_code" -le "$ANDROID_PREVIOUS_VERSION_CODE" ]; then
            echo "Error: AAB versionCode $apk_version_code must be greater than previous versionCode $ANDROID_PREVIOUS_VERSION_CODE."
            exit 1
          fi

          # Android App Bundles are signed as a JAR (APK Signature Scheme v1-style
          # META-INF signature), so jarsigner is the appropriate verification tool.
          if ! signer_info="$(jarsigner -verify -verbose -certs "$aab_path" 2>&1)"; then
            printf '%s\n' "$signer_info"
            echo "Error: AAB signature verification failed for $aab_path."
            exit 1
          fi

          if ! printf '%s\n' "$signer_info" | grep -q "jar verified"; then
            printf '%s\n' "$signer_info"
            echo "Error: jarsigner did not confirm the AAB signature."
            exit 1
          fi

          if printf '%s\n' "$signer_info" | grep -q 'CN=Android Debug'; then
            echo "Error: AAB is signed with the Android Debug certificate, not the configured Release key."
            exit 1
          fi

          # Cross-check the signing certificate fingerprint against the configured
          # release keystore alias to confirm the expected key was used.
          keystore_cert_sha256="$(keytool -list -v -keystore release.keystore -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/ { print $2; exit }')"
          aab_cert_sha256="$(keytool -printcert -jarfile "$aab_path" 2>/dev/null | awk -F': ' '/SHA256:/ { print $2; exit }')"

          if [ -z "$keystore_cert_sha256" ] || [ -z "$aab_cert_sha256" ]; then
            echo "Error: Unable to read release keystore or AAB certificate SHA-256."
            exit 1
          fi

          if [ "$keystore_cert_sha256" != "$aab_cert_sha256" ]; then
            echo "Error: AAB signing certificate ($aab_cert_sha256) does not match the configured release keystore certificate ($keystore_cert_sha256)."
            exit 1
          fi

          {
            echo "applicationId=$package_name"
            echo "packageName=$package_name"
            echo "versionCode=$apk_version_code"
            echo "previousVersionCode=$ANDROID_PREVIOUS_VERSION_CODE"
            echo "versionName=$apk_version_name"
            echo "buildType=release"
            echo "signing=release"
            echo "signed=true"
            echo "keystoreCertificateSha256=$keystore_cert_sha256"
            echo "aabCertificateSha256=$aab_cert_sha256"
          } | tee app/build/outputs/bundle/release/meetyoulive-release-aab-metadata.txt
        shell: bash

      - name: Remove temporary Android secrets
        if: always()
        working-directory: frontend
        run: rm -f android/app/google-services.json android/app/release.keystore
        shell: bash

      - name: Upload signed Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetYouLive-release-aab-${{ github.run_number }}
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/bundle/release/meetyoulive-release-aab-metadata.txt
          retention-days: 30
          if-no-files-found: error

      - name: Report AAB update status
        run: |
          metadata_path="frontend/android/app/build/outputs/bundle/release/meetyoulive-release-aab-metadata.txt"
          {
            echo "## Android Release AAB"
            echo
            echo "Artifact: MeetYouLive-release-aab-${{ github.run_number }}"
            echo
            echo "- applicationId: $(awk -F= '/^applicationId=/ { print $2; exit }' "$metadata_path")"
            echo "- packageName: $(awk -F= '/^packageName=/ { print $2; exit }' "$metadata_path")"
            echo "- previous versionCode: $(awk -F= '/^previousVersionCode=/ { print $2; exit }' "$metadata_path")"
            echo "- versionCode: $(awk -F= '/^versionCode=/ { print $2; exit }' "$metadata_path")"
            echo "- versionName: $(awk -F= '/^versionName=/ { print $2; exit }' "$metadata_path")"
            echo "- signing: release keystore from ANDROID_KEYSTORE_BASE64"
            echo "- release keystore certificate SHA-256: $(awk -F= '/^keystoreCertificateSha256=/ { print $2; exit }' "$metadata_path")"
            echo "- AAB signing certificate SHA-256: $(awk -F= '/^aabCertificateSha256=/ { print $2; exit }' "$metadata_path")"
            echo
            echo "Upload app-release.aab to Google Play Console (App bundle explorer / production track)."
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
