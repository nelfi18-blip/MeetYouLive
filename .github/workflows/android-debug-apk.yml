name: Android Debug APK

# Generates a Debug APK and uploads it as a GitHub Actions artifact.
# No secrets, no signing, no publishing.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/android/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build from (default: current branch)'
        required: false
        default: ''
      app_url:
        description: 'App URL loaded by Capacitor WebView'
        required: false
        default: 'https://meetyoulive.net'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Java 21 is required by capacitor.build.gradle (JavaVersion.VERSION_21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore google-services.json (Firebase)
        id: restore_google_services
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          EXPECTED_ANDROID_PACKAGE_NAME: com.meetyoulive.app
        run: |
          set -euo pipefail
          mkdir -p frontend/android/app

          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Firebase configuration not available; Firebase features will be disabled for this debug/development APK build."
            echo "google_services_restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          normalized_google_services_json_base64="$(printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n\t ')"

          if ! printf '%s' "$normalized_google_services_json_base64" \
            | base64 --decode \
            > frontend/android/app/google-services.json; then
            echo "Error: Failed to restore google-services.json from ANDROID_GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

          if [ ! -s frontend/android/app/google-services.json ]; then
            echo "Error: google-services.json is missing or empty."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/android/app/google-services.json';
          const expectedPackageName = process.env.EXPECTED_ANDROID_PACKAGE_NAME;
          try {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const hasExpectedPackage = Array.isArray(data.client)
              && data.client.some((client) => client?.client_info?.android_client_info?.package_name === expectedPackageName);

            if (!hasExpectedPackage) {
              console.error(`Error: google-services.json is missing package_name ${expectedPackageName}.`);
              process.exit(1);
            }
          } catch (e) {
            console.error(`Error: Invalid google-services.json (${e.message}).`);
            process.exit(1);
          }
          NODE
          echo "google_services_restored=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Verify google-services.json exists
        if: steps.restore_google_services.outputs.google_services_restored == 'true'
        run: |
          test -s frontend/android/app/google-services.json
        shell: bash

      - name: Verify google-services.json is gitignored
        if: steps.restore_google_services.outputs.google_services_restored == 'true'
        run: |
          root_has_entry=0
          android_has_entry=0

          if [ -f .gitignore ] && grep -Fq 'frontend/android/app/google-services.json' .gitignore; then
            root_has_entry=1
          fi

          if [ -f frontend/android/.gitignore ] && grep -Fq 'app/google-services.json' frontend/android/.gitignore; then
            android_has_entry=1
          fi

          if [ "$root_has_entry" -eq 0 ] && [ "$android_has_entry" -eq 0 ]; then
            echo "Error: Add 'frontend/android/app/google-services.json' to a .gitignore file."
            exit 1
          fi
        shell: bash

      # Capacitor sync generates the gitignored files that Gradle needs:
      #   - android/capacitor-cordova-android-plugins/
      #   - android/app/src/main/assets/public/
      #   - android/app/src/main/assets/capacitor.config.json
      #   - android/app/src/main/assets/capacitor.plugins.json
      #   - android/app/src/main/res/xml/config.xml
      # Cache Gradle home to speed up subsequent runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        env:
          NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.app_url || 'https://meetyoulive.net' }}
        run: |
          cd frontend
          npm ci
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        shell: bash

      - name: Delete google-services.json
        if: always()
        run: |
          rm -f frontend/android/app/google-services.json
        shell: bash

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetYouLive-debug-${{ github.run_number }}
          # Standard output path for Gradle assembleDebug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Report APK Firebase status
        env:
          GOOGLE_SERVICES_RESTORED: ${{ steps.restore_google_services.outputs.google_services_restored }}
        run: |
          {
            echo "## Android Debug APK"
            echo
            echo "Artifact: MeetYouLive-debug-${{ github.run_number }}"
            echo
            case "$GOOGLE_SERVICES_RESTORED" in
              true)
                echo "APK generated with Firebase enabled."
                ;;
              *)
                echo "APK generated with Firebase disabled."
                echo
                echo "This no-firebase fallback is allowed only for debug/development APK builds."
                echo "Do not mark READY FOR MERGE based only on a workflow run that passed through this fallback."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
